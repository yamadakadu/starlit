# Configuração do site de documentação (Zensical).
# Pré-visualização local: uvx zensical serve
# Build: uvx zensical build --clean  (gera a pasta site/)

[project]
site_name = "Starlit"
site_description = "Provisionamento pela rede de um cluster Kubernetes bare-metal com UP Boards"
site_url = "https://yamadakadu.github.io/starlit/"
repo_url = "https://github.com/yamadakadu/starlit"
repo_name = "yamadakadu/starlit"
edit_uri = "edit/starlit-docs/docs/"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Início" = "index.md" },
  { "Projeto" = "projeto.md" },
  { "Arquitetura" = "arquitetura.md" },
  { "Decisões do projeto" = "decisoes.md" },
  { "Tutorial" = [
    "tutorial/index.md",
    "tutorial/1-rede.md",
    "tutorial/2-placas.md",
    "tutorial/3-servidor.md",
    "tutorial/4-repositorio.md",
    "tutorial/5-scripts.md",
    "tutorial/6-acesso.md",
    "tutorial/7-logs.md",
  ] },
  { "Etapas" = [
    "etapas/index.md",
    { "Parte 1" = [
      "etapas/1-infraestrutura.md",
      "etapas/2-imagem.md",
      "etapas/3-servidor.md",
      "etapas/4-bootloader.md",
      "etapas/5-instalacao.md",
      "etapas/validacao-parte-1.md",
    ] },
    { "Parte 2" = [
      "etapas/6-registro.md",
      "etapas/validacao-parte-2.md",
      "etapas/7-cluster.md",
    ] },
  ] },
  { "Referência" = [
    "referencia/especificacoes.md",
    "referencia/inventario.md",
    "referencia/configuracao.md",
  ] },
]

[project.theme]
language = "pt-BR"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Usar tema claro"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Usar tema escuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Usar o tema do sistema"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
